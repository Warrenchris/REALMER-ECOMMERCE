version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: realmer-db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - realmer-network

  wordpress:
    image: wordpress:6-php8.2-apache
    container_name: realmer-wordpress
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: 1
    volumes:
      - wp-data:/var/www/html
      - ./themes/realmer-theme:/var/www/html/wp-content/themes/realmer-theme
    ports:
      - "8080:80"
    networks:
      - realmer-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: realmer-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80"
    networks:
      - realmer-network

volumes:
  db-data:
  wp-data:

networks:
  realmer-network:
    driver: bridge
